[project]
name = "squeeze-cli"
version = "0.1.0"
description = "Compress images and video on Linux to fit a target size (Discord, email, WhatsApp, etc.) — CLI companion to the Squeeze Android app."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
squeeze = "squeeze_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["squeeze_cli*"]
